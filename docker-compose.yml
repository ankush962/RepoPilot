services:

  # ---------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------

  db:
    image: pgvector/pgvector:pg17
    container_name: repopilot-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-repopilot} -d ${POSTGRES_DB:-ai_copilot}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - repopilot


  # ---------------------------------------------------------------
  # DATABASE MIGRATIONS
  # ---------------------------------------------------------------

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: repopilot-migrate

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://repopilot:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_copilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    restart: "no"

    networks:
      - repopilot



  # ---------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: repopilot-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - repopilot


  # ---------------------------------------------------------------
  # API
  # ---------------------------------------------------------------

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: repopilot-api
    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://repopilot:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_copilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}

      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-repopilot_session}
      SESSION_EXPIRE_DAYS: ${SESSION_EXPIRE_DAYS:-7}

      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}

      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-10}

      WORKSPACE_DIR: /app/workspace

      WORKER_ENABLED: "false"
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      MAX_INDEX_ATTEMPTS: ${MAX_INDEX_ATTEMPTS:-3}
      STALE_JOB_MINUTES: ${STALE_JOB_MINUTES:-30}

      MAX_CHAT_MESSAGE_CHARS: ${MAX_CHAT_MESSAGE_CHARS:-4000}
      MAX_RETRIEVAL_LIMIT: ${MAX_RETRIEVAL_LIMIT:-12}

      GIT_AUTO_SYNC_ENABLED: ${GIT_AUTO_SYNC_ENABLED:-true}
      GIT_AUTO_SYNC_INTERVAL_SECONDS: ${GIT_AUTO_SYNC_INTERVAL_SECONDS:-60}
      GIT_COMPARE_MAX_COMMITS: ${GIT_COMPARE_MAX_COMMITS:-100}

      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}

      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0}
      MODEL_NUM_PREDICT: ${MODEL_NUM_PREDICT:-2000}
      MODEL_NUM_CTX: ${MODEL_NUM_CTX:-8192}

      AUTO_CREATE_TABLES: "false"
      ENSURE_SCHEMA_ON_STARTUP: "false"

    volumes:
      - repo_workspace:/app/workspace


    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers"
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - repopilot


  # ---------------------------------------------------------------
  # WORKER
  # ---------------------------------------------------------------

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: repopilot-worker
    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://repopilot:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_copilot}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}

      WORKSPACE_DIR: /app/workspace

      WORKER_ENABLED: "false"
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      MAX_INDEX_ATTEMPTS: ${MAX_INDEX_ATTEMPTS:-3}
      STALE_JOB_MINUTES: ${STALE_JOB_MINUTES:-30}

      GIT_AUTO_SYNC_ENABLED: ${GIT_AUTO_SYNC_ENABLED:-true}
      GIT_AUTO_SYNC_INTERVAL_SECONDS: ${GIT_AUTO_SYNC_INTERVAL_SECONDS:-60}
      GIT_COMPARE_MAX_COMMITS: ${GIT_COMPARE_MAX_COMMITS:-100}

      AUTO_CREATE_TABLES: "false"
      ENSURE_SCHEMA_ON_STARTUP: "false"

    volumes:
      - repo_workspace:/app/workspace

    command:
      [
        "python",
        "-m",
        "app.services.worker"
      ]

    networks:
      - repopilot


  # ---------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}

    container_name: repopilot-frontend
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}


    networks:
      - repopilot



  # ---------------------------------------------------------------
  # REVERSE PROXY / HTTPS
  # ---------------------------------------------------------------

  caddy:
    image: caddy:2-alpine
    container_name: repopilot-caddy
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

    ports:
      - "18080:8080"
      - "18443:8443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - repopilot



  # ---------------------------------------------------------------
  # MONITORING
  # ---------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: repopilot-prometheus
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "19090:9090"

    networks:
      - repopilot


  grafana:
    image: grafana/grafana:latest
    container_name: repopilot-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "13000:3000"

    networks:
      - repopilot


volumes:
  postgres_data:
    name: repopilot-postgres-data

  repo_workspace:
    name: repopilot-repository-workspace

  caddy_data:
    name: repopilot-caddy-data

  redis_data:
    name: repopilot-redis-data

  prometheus_data:
    name: repopilot-prometheus-data

  grafana_data:
    name: repopilot-grafana-data

  caddy_config:
    name: repopilot-caddy-config


networks:
  repopilot:
    name: repopilot-network
    driver: bridge
