services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: ai_copilot
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  postgres_data:
  qdrant_data:
