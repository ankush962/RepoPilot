name: RepoPilot CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python
        run: |
          python -m compileall -q app

      - name: Run tests
        run: |
          pytest -q


  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        run: |
          npm run build


  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t repopilot-api:ci \
            backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t repopilot-frontend:ci \
            frontend


  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name repopilot-ci-db \
            -e POSTGRES_DB=ai_copilot \
            -e POSTGRES_USER=repopilot \
            -e POSTGRES_PASSWORD=repopilot_ci_password \
            -p 5432:5432 \
            pgvector/pgvector:pg17

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if docker exec repopilot-ci-db pg_isready \
              -U repopilot \
              -d ai_copilot; then
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://repopilot:repopilot_ci_password@localhost:5432/ai_copilot
        run: |
          alembic upgrade head

      - name: Verify Alembic head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://repopilot:repopilot_ci_password@localhost:5432/ai_copilot
        run: |
          alembic current

      - name: Cleanup
        if: always()
        run: |
          docker rm -f repopilot-ci-db || true