name: RepoPilot CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repopilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python
        run: |
          python -m compileall -q app

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/repopilot_test
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/repopilot_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -q tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        run: |
          npm run build

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm run build

      - name: Run E2E tests
        run: |
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore  

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t repopilot-api:ci \
            backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t repopilot-frontend:ci \
            frontend

  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name repopilot-ci-db \
            -e POSTGRES_DB=ai_copilot \
            -e POSTGRES_USER=repopilot \
            -e POSTGRES_PASSWORD=repopilot_ci_password \
            -p 5432:5432 \
            pgvector/pgvector:pg17

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if docker exec repopilot-ci-db pg_isready \
              -U repopilot \
              -d ai_copilot; then
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://repopilot:repopilot_ci_password@localhost:5432/ai_copilot
        run: |
          alembic upgrade head

      - name: Verify Alembic head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://repopilot:repopilot_ci_password@localhost:5432/ai_copilot
        run: |
          alembic current

      - name: Cleanup
        if: always()
        run: |
          docker rm -f repopilot-ci-db || true
